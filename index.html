<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi SMKN 1 Kota Serang</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#111827;
}

header{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:22px 10px;
}

header h1{
    margin:0;
    font-size:23px;
}

header p{
    margin:6px 0 0;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:15px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 3px 12px #0002;
}

h2{
    margin-top:0;
    color:#1d4ed8;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    font-weight:bold;
    cursor:pointer;
}

.btn-scan{
    background:#2563eb;
    color:white;
}

.btn-hadir{
    background:#16a34a;
    color:white;
    width:100%;
    margin-top:10px;
}

.btn-batal{
    background:#dc2626;
    color:white;
    width:100%;
    margin-top:8px;
}

#reader{
    width:100%;
    max-width:500px;
    margin:auto;
}

#konfirmasi{
    display:none;
    border:2px solid #22c55e;
    background:#f0fdf4;
}

.nama{
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

.select-tipe {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 10px;
}

.status{
    background:#16a34a;
    color:white;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,td{
    border:1px solid #ddd;
    padding:9px;
    text-align:left;
}

th{
    background:#2563eb;
    color:white;
}

.qr-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.qr-card{
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    text-align:center;
    background:#fff;
}

.qr{
    display:flex;
    justify-content:center;
    margin:10px 0;
}

.nomor{
    font-weight:bold;
    color:#2563eb;
}

.nama-qr{
    font-size:14px;
    min-height:35px;
}

@media(max-width:500px){
    table{
        font-size:12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>SMKN 1 KOTA SERANG</h1>
    <p>ABSENSI ONLINE QR CODE</p>
</header>

<div class="container">

    <!-- SCANNER -->
    <div class="card">
        <h2>📷 Scan QR Siswa</h2>

        <div id="reader"></div>

        <p id="hasilScan">
            Silakan arahkan kamera ke QR siswa.
        </p>
    </div>

    <!-- KONFIRMASI -->
    <div class="card" id="konfirmasi">

        <h2>⚙️ Pengaturan Absensi</h2>

        <p>Nama Siswa:</p>
        <div class="nama" id="namaScan">-</div>

        <p>Tipe Presensi:</p>
        <select id="tipeAbsen" class="select-tipe">
            <option value="DATANG">🌅 Presensi Datang</option>
            <option value="PULANG">🌆 Presensi Pulang</option>
        </select>

        <p>Status:</p>
        <div class="status">
            ✅ HADIR
        </div>

        <button class="btn-hadir" id="btnKonfirmasi" onclick="konfirmasiHadir()">
            KONFIRMASI HADIR
        </button>

        <button class="btn-batal" onclick="batalScan()">
            BATAL
        </button>
    </div>

    <!-- DAFTAR ABSEN -->
    <div class="card">
        <h2>📋 Daftar Absensi</h2>

        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama</th>
                    <th>Tipe</th>
                    <th>Status</th>
                    <th>Waktu</th>
                </tr>
            </thead>

            <tbody id="tabelAbsen"></tbody>
        </table>
    </div>

    <!-- QR SISWA -->
    <div class="card">
        <h2>🎫 QR Code Siswa</h2>
        <p>Setiap siswa mempunyai QR Code sendiri.</p>

        <div class="qr-grid" id="qrGrid"></div>
    </div>

</div>

<script>

const FORMSPREE_URL = "https://formspree.io/f/myezkbvp";

const siswa = [
"ABDAN KAUTSAR NUGRAHA",
"ARSAVA KEYLA CAPRICONITA",
"AYATU SIFANA RAMADANI",
"BINTANG AFIYA RACHMA",
"CHANTIKA PUTRI AULIA LUBIS",
"DHEA PUTRI RAMADANI",
"DZAKWAN RAMADANI",
"EKA SAPUTRA",
"FARAS NUGRAHA",
"FEBRI RAHMADANI",
"LINGGA FAULINA",
"M. PUTRA ALIFIAN",
"MIFTAKHUL ULUM",
"MOCHAMAD ARAMERU QESHA",
"MOZHA SEREN ALVIONA",
"MUHAMAD ADAM MAULANA",
"MUHAMAD IKHSAN HIBATULLOH",
"MUHAMAD SURYA ABDULLAH",
"MUHAMMAD IHSAN FAWAZ",
"MUHAMMAD AZZAMY SYAUQI",
"MUHAMMAD DARUL FARH",
"MUHAMMAD FAIRUZZ TAMIRULLAH",
"MUHAMMAD FATHAN AL'ATQA",
"MUHAMMAD RAYSHA RAMADHANI",
"NASYA ABIEZA CHOIR",
"NAZAR ARDIANSYAH",
"PRISCO STEVEN SIBURIAN",
"PUTRANTO ADI NUGROHO",
"RANGGA HIDAYATULLAH",
"RIDHO RACHMAN",
"RIFKI AKBAR DARMANTO",
"RIZKI FATHAN MAULIDAN",
"ROBI SUJANA",
"SULTAN",
"YUSUF ASTHA FAIRUS",
"ZIFARA KAYLA PUTRI"
];

let siswaTerpilih = null;

/* =========================
   BUAT QR 36 SISWA
========================= */

const qrGrid = document.getElementById("qrGrid");

siswa.forEach((nama,index)=>{

    const id = "ABSEN-" + String(index+1).padStart(2,"0");

    const card = document.createElement("div");
    card.className = "qr-card";

    card.innerHTML = `
        <div class="nomor">QR ${index+1}</div>
        <div class="nama-qr">${nama}</div>
        <div class="qr" id="qr-${index+1}"></div>
    `;

    qrGrid.appendChild(card);

    new QRCode(document.getElementById(`qr-${index+1}`),{
        text:id,
        width:140,
        height:140
    });

});


/* =========================
   SCANNER
========================= */

function hasilScan(decodedText){

    const cocok = decodedText.match(/^ABSEN-(\d+)$/);

    if(!cocok){
        document.getElementById("hasilScan").innerHTML =
        "❌ QR tidak dikenali.";
        return;
    }

    const nomor = parseInt(cocok[1]);

    if(nomor < 1 || nomor > siswa.length){
        return;
    }

    siswaTerpilih = nomor - 1;

    const nama = siswa[siswaTerpilih];

    document.getElementById("namaScan").textContent = nama;

    document.getElementById("konfirmasi").style.display = "block";

    document.getElementById("hasilScan").innerHTML =
        "✅ QR berhasil dipindai!";

    // hentikan kamera setelah berhasil scan
    if(window.scanner){
        window.scanner.clear();
    }

}


/* =========================
   MULAI SCANNER
========================= */

window.scanner = new Html5Qrcode("reader");

window.scanner.start(
    { facingMode:"environment" },
    {
        fps:10,
        qrbox:{
            width:250,
            height:250
        }
    },
    hasilScan,
    function(error){
        // abaikan error scan biasa
    }
).catch(function(error){

    document.getElementById("hasilScan").innerHTML =
    "❌ Kamera tidak bisa dibuka. Izinkan akses kamera dan gunakan HTTPS.";

});


/* =========================
   KONFIRMASI HADIR
========================= */

async function konfirmasiHadir(){

    if(siswaTerpilih === null){
        return;
    }

    const btnHadir = document.getElementById("btnKonfirmasi");
    btnHadir.disabled = true;
    btnHadir.innerText = "MENGIRIM...";

    const nama = siswa[siswaTerpilih];
    const tipeAbsen = document.getElementById("tipeAbsen").value;

    const sekarang = new Date();

    const waktu =
        sekarang.toLocaleDateString("id-ID") +
        " " +
        sekarang.toLocaleTimeString("id-ID");

    let data =
        JSON.parse(localStorage.getItem("absensiSMKN1")) || [];

    // cek apakah sudah absen dengan jenis yang sama hari ini
    const hariIni = sekarang.toLocaleDateString("id-ID");

    const sudah = data.some(item =>
        item.nama === nama &&
        item.tipe === tipeAbsen &&
        item.waktu.startsWith(hariIni)
    );

    if(sudah){
        alert("⚠️ " + nama + " sudah melakukan presensi " + tipeAbsen + " hari ini!");
        btnHadir.disabled = false;
        btnHadir.innerText = "KONFIRMASI HADIR";
        batalScan();
        return;
    }

    // Kirim data ke Formspree
    try {
        await fetch(FORMSPREE_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                Nama: nama,
                Tipe_Presensi: tipeAbsen,
                Status: "HADIR",
                Waktu: waktu
            })
        });
    } catch (err) {
        console.error("Gagal mengirkan data ke Formspree:", err);
    }

    // Simpan ke localStorage
    data.push({
        nama:nama,
        tipe:tipeAbsen,
        status:"HADIR",
        waktu:waktu
    });

    localStorage.setItem(
        "absensiSMKN1",
        JSON.stringify(data)
    );

    tampilkanAbsen();

    alert("✅ " + nama + " berhasil absen " + tipeAbsen + " dan terkirim ke server!");

    btnHadir.disabled = false;
    btnHadir.innerText = "KONFIRMASI HADIR";
    batalScan();
}


/* =========================
   BATAL
========================= */

function batalScan(){

    siswaTerpilih = null;

    document.getElementById("konfirmasi").style.display = "none";

    document.getElementById("namaScan").textContent = "-";

    document.getElementById("hasilScan").textContent =
        "Silakan scan QR siswa.";

    // mulai kamera lagi
    window.scanner = new Html5Qrcode("reader");

    window.scanner.start(
        {facingMode:"environment"},
        {
            fps:10,
            qrbox:{
                width:250,
                height:250
            }
        },
        hasilScan,
        function(error){}
    ).catch(function(){});

}


/* =========================
   TAMPILKAN DATA ABSEN
========================= */

function tampilkanAbsen(){

    const tbody = document.getElementById("tabelAbsen");

    tbody.innerHTML = "";

    const data =
        JSON.parse(localStorage.getItem("absensiSMKN1")) || [];

    data.forEach((item,index)=>{

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${index+1}</td>
            <td>${item.nama}</td>
            <td><b>${item.tipe || "DATANG"}</b></td>
            <td>✅ ${item.status}</td>
            <td>${item.waktu}</td>
        `;

        tbody.appendChild(tr);

    });

}

tampilkanAbsen();

</script>

</body>
</html>
