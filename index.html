<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Digital - XI TKJ 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #34495e;
        }

        input[type="date"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #3498db;
            color: white;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .status-options {
            display: flex;
            gap: 12px;
        }

        .status-options label {
            font-weight: normal;
            font-size: 14px;
            margin-bottom: 0;
            cursor: pointer;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button[type="submit"]:hover {
            background-color: #27ae60;
        }

        @media (max-width: 600px) {
            th, td {
                padding: 8px 5px;
                font-size: 13px;
            }

            .status-options {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Absensi Digital</h1>
        <p class="subtitle">Kelas XI TKJ 2</p>

        <form action="https://formspree.io/f/myezkbvp" method="POST">
            
            <div class="form-group">
                <label for="tanggal">Tanggal Absensi:</label>
                <input type="date" id="tanggal" name="Tanggal" required>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 5%;">No</th>
                        <th style="width: 45%;">Nama Siswa</th>
                        <th style="width: 50%;">Keterangan</th>
                    </tr>
                </thead>
                <tbody>
                    
                    <script>
                        const siswaList = [
                            "Abdan Kautsar Nugraha",
                            "Arsava keyla capriconita",
                            "Ayatu syifana ramadan",
                            "Bintang Afiya rachma",
                            "Chantika putri aulia lubis",
                            "Dhea putri ramadan",
                            "Dzakwan ramadani",
                            "Faras nugraha",
                            "Febri rahmadini",
                            "Lingga faulina",
                            "M.putra aliffian",
                            "Miftahul ulum",
                            "Mochamad arameru qesha",
                            "Mozha sheren alviona",
                            "Muhamad adam maulana",
                            "Muhamad ikhsan hibatulloh",
                            "Muhamad surya abdullah",
                            "Muhammad ihsan fawwaz",
                            "Muhammad azzamy syauqi",
                            "Muhammad fairuz tamirullah",
                            "Muhammad fathan al'atqa",
                            "Muhammad raysha ramdhani",
                            "Nasya abieza choir",
                            "Nazar andriyansyah",
                            "Prisco steven siburian",
                            "Putranto adi nugroho",
                            "Rangga hidayatullah",
                            "Ridho rachman",
                            "Rifki akbar darmanto",
                            "Rizki fathan maulidan",
                            "Robi sujana",
                            "Sultan",
                            "Yusuf astha fairus",
                            "Zifara kayla putri"
                        ];

                        siswaList.forEach((nama, index) => {
                            const no = index + 1;
                            document.write(`
                                <tr>
                                    <td>${no}</td>
                                    <td>${nama}</td>
                                    <td>
                                        <div class="status-options">
                                            <label><input type="radio" name="Absen_${nama}" value="Hadir" required> Hadir</label>
                                            <label><input type="radio" name="Absen_${nama}" value="Izin"> Izin</label>
                                            <label><input type="radio" name="Absen_${nama}" value="Sakit"> Sakit</label>
                                            <label><input type="radio" name="Absen_${nama}" value="Alpha"> Alpha</label>
                                        </div>
                                    </td>
                                </tr>
                            `);
                        });
                    </script>

                </tbody>
            </table>

            <button type="submit">Kirim Absensi</button>

        </form>
    </div>

    <script>
        // Set default tanggal hari ini
        document.getElementById('tanggal').valueAsDate = new Date();
    </script>

</body>
</html>
